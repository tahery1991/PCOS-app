name: Deploy PCOS Smart App to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ==========================================
  # Build
  # ==========================================

  build:
    runs-on: ubuntu-latest

    steps:
      # دریافت کد پروژه
      - name: Checkout
        uses: actions/checkout@v6

      # نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # آماده‌سازی GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # نصب وابستگی‌ها
      - name: Install dependencies
        run: npm ci

      # ساخت نسخه Production
      - name: Build Vue App
        run: npm run build

      # آپلود پوشه dist
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  # ==========================================
  # Deploy
  # ==========================================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
